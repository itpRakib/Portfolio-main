<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="250" cy="250" r="240" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#circle-clip)">
    <!-- Base Blue Background -->
    <circle cx="250" cy="250" r="240" fill="#006eb6" />
    
    <!-- Light Grey Left Swoosh/Circle -->
    <circle cx="205" cy="235" r="225" fill="#f0f0f0" />
    
    <!-- Diagonal Squares Group -->
    <!-- Rotated to match the image angle (approx. 45 degrees) -->
    <g transform="translate(250, 250) rotate(-45) translate(-250, -250)">
      <!-- Main Diagonal of Large Blue/White Squares -->
      <!-- Top-Left Square -->
      <rect x="130" y="130" width="70" height="70" fill="#006eb6" rx="4" />
      <rect x="145" y="145" width="40" height="40" fill="#f0f0f0" rx="2" />
      
      <!-- Middle Square -->
      <rect x="215" y="130" width="70" height="70" fill="#006eb6" rx="4" />
      <rect x="230" y="145" width="40" height="40" fill="#f0f0f0" rx="2" />
      
      <!-- Bottom-Right Square -->
      <rect x="300" y="130" width="70" height="70" fill="#006eb6" rx="4" />
      <rect x="315" y="145" width="40" height="40" fill="#f0f0f0" rx="2" />

      <!-- Second Row: Medium Blue/White Squares -->
      <rect x="175" y="215" width="50" height="50" fill="#006eb6" rx="3" />
      <rect x="185" y="225" width="30" height="30" fill="#f0f0f0" rx="1.5" />
      
      <rect x="260" y="215" width="50" height="50" fill="#006eb6" rx="3" />
      <rect x="270" y="225" width="30" height="30" fill="#f0f0f0" rx="1.5" />

      <!-- Third Row: Solid Light Grey Squares -->
      <rect x="220" y="280" width="32" height="32" fill="#f0f0f0" rx="2" />
      <rect x="305" y="280" width="32" height="32" fill="#f0f0f0" rx="2" />
      
      <!-- Fourth Row: Even smaller solid light grey squares -->
      <rect x="265" y="330" width="20" height="20" fill="#f0f0f0" rx="1" />
      <rect x="340" y="330" width="20" height="20" fill="#f0f0f0" rx="1" />
    </g>
  </g>
</svg>
